name: Auto PR

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request
        run: |
          gh pr create --base main --head "$GITHUB_REF_NAME" \
            --title "Merge $GITHUB_REF_NAME" --body "Automated pull request." \
            || echo "PR already exists"

      - name: Enable auto-merge
        run: gh pr merge "$GITHUB_REF_NAME" --auto --merge --delete-branch

      - name: Comment branch coverage badge
        run: |
          BADGE="https://coveralls.io/repos/github/$GH_REPO/badge.svg?branch=$GITHUB_REF_NAME"
          gh pr comment "$GITHUB_REF_NAME" --body "Coverage for \`$GITHUB_REF_NAME\`: [![Coverage]($BADGE)](https://coveralls.io/github/$GH_REPO?branch=$GITHUB_REF_NAME)"
